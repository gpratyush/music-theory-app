name: Android

on:
  pull_request:
    paths: ["android/**", "App/Resources/Piano/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "App/Resources/Piano/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android app build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Theory tests
        run: ./gradlew :theory:test --console=plain
      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain
      # Debug-key signed, so it installs straight onto a phone (allow "unknown sources").
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MusicTheory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicTheory-android-apk
          path: android/MusicTheory.apk
          retention-days: 14
