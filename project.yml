name: MusicTheoryApp
options:
  bundleIdPrefix: com.gpratyush
  deploymentTarget:
    iOS: "17.0"
packages:
  MusicTheory:
    path: MusicTheory
targets:
  MusicTheoryApp:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: MusicTheory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpratyush.musictheory
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Music Theory
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    scheme: {}
